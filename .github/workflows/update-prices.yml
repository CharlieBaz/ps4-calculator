name: Update prices

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:         # adds a "Run workflow" button so you can run it by hand

permissions:
  contents: write            # lets the workflow save prices.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from eBay
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        shell: bash               # makes the step fail properly if the script fails
        run: python -u scripts/update_prices.py 2>&1 | tee update_log.txt

      - name: Save prices.json and the log
        if: always()               # save the log even when the update failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json update_log.txt
          git diff --staged --quiet || (git commit -m "Daily price update" && git push)
